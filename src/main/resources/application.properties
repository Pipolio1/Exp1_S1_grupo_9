spring.application.name=bank-legacy-batch

# Evita que Spring Batch ejecute un Job automaticamente al iniciar la aplicacion
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# Base de datos H2 embebida (perfil por defecto)
spring.datasource.url=jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 (accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Inicializar siempre el esquema propio (schema.sql)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
